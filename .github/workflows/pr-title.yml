name: pr-title

# PRs are squash-merged with their title as the commit, and release-please reads that commit to
# pick the next version: `fix:` is a patch, `feat:` a minor, and `!` a breaking change.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: .+"; then
            echo "::error::Start the PR title with a type, such as 'fix: ...' or 'feat: ...' ($types)."
            exit 1
          fi
