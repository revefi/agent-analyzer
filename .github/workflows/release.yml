name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs all third-party and repository code, so it gets no secrets and no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No caches here: a release must not restore anything another workflow wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Committed plugin bundle matches the source
        run: |
          git status --porcelain -- integrations/claude-code
          test -z "$(git status --porcelain -- integrations/claude-code)"

      - name: Compile standalone binaries and pack the npm tarball
        run: |
          version=$(node -p 'require("./package.json").version')
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            out="release/revefi-agent-analyzer-$target"
            case "$target" in windows-*) out="$out.exe" ;; esac
            bun build cli/src/bin.ts --compile --minify --target="bun-$target" \
              --define "__VERSION__=\"$version\"" --outfile "$out"
          done
          cp dist/revefi-agent-analyzer.js install.sh release/
          npm pack --ignore-scripts --pack-destination release
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Bun's macOS binaries keep the signature of the runtime they were built from, which the
  # appended app invalidates; an ad-hoc signature makes them valid again. Installs nothing.
  sign-macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Ad-hoc sign the macOS binaries and refresh the checksums
        working-directory: release
        run: |
          for f in revefi-agent-analyzer-darwin-arm64 revefi-agent-analyzer-darwin-x64; do
            codesign --force --sign - "$f"
            codesign -v "$f"
          done
          rm SHA256SUMS
          shasum -a 256 -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          overwrite: true

  # Each binary must start on the platform it is for, including the macOS ones built on Linux.
  verify:
    needs: sign-macos
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, file: revefi-agent-analyzer-linux-x64 }
          - { os: ubuntu-24.04-arm, file: revefi-agent-analyzer-linux-arm64 }
          - { os: macos-latest, file: revefi-agent-analyzer-darwin-arm64 }
          - { os: macos-15-intel, file: revefi-agent-analyzer-darwin-x64 }
          - { os: windows-latest, file: revefi-agent-analyzer-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Runs and reports the tag's version
        shell: bash
        env:
          FILE: ${{ matrix.file }}
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x "$FILE"
          if [ "$RUNNER_OS" = macOS ]; then codesign -v "$FILE"; fi
          test "v$("./$FILE" --version)" = "$TAG"

  # Holds the write and signing permissions; runs no repository code and installs nothing.
  publish:
    needs: [sign-macos, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Repository is public and the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          if [ "$visibility" != public ]; then
            echo "::error::Releases need a public repository (this one is $visibility): npm provenance and the installer both depend on it."
            exit 1
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main" --jq .status)
          case "$status" in
            identical | ahead) ;;
            *) echo "::error::Tag commit $GITHUB_SHA is not on main ($status)"; exit 1 ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - run: (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Draft first, so a failed npm publish never leaves a half-published release behind.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes $flags release/*

      # npm trusted publishing (OIDC): no token is stored; provenance is attached automatically.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm install -g npm@11.6.2
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          npm publish release/revefi-agent-analyzer-*.tgz --access public --tag "$dist_tag" --ignore-scripts

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
